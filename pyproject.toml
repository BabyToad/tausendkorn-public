[project]
name = "tausendkorn"
version = "0.1.0"
description = "Körner auf A4 zählen: Tausendkorngewicht und Kornqualität aus einem Handyfoto"
readme = "README.md"
license = "AGPL-3.0-only"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.162.0",
    "httpx>=0.28.1",
    "keyring>=25.7.0",
    "mcp>=2.3,<3",
    "numpy>=2.5.4",
    "opencv-python-headless>=5.0.0.93",
    "pillow>=13.0.0",
    "python-multipart>=0.0.32",
    "qrcode>=8.2",
    "uvicorn>=0.54.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tausendkorn"]

# CUDA-Torch nur für die GPU-Läufe (RTX 3070 workstation): `uv sync --group gpu`
[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu128" }
torchvision = { index = "pytorch-cu128" }

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
gpu = [
    "einops>=0.8.2",
    "hydra-core>=1.3.8",
    "iopath>=0.1.10",
    "omegaconf>=2.3.1",
    "pycocotools>=2.0.11",
    "scikit-image>=0.26.0",
    "scipy>=1.18.1",
    "torch>=2.11.0",
    "torchvision>=0.26.0",
    "tqdm>=4.70.1",
    "ultralytics>=8.4.190",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
