<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1260 900" font-family="Helvetica, Arial, sans-serif" fill="#111">
  <rect width="1260" height="900" fill="#f2f2f2"/>
  <style>
    .dev{fill:#fff;stroke:#111;stroke-width:3}
    .t{font-size:26px;font-weight:700}
    .s{font-size:17px;fill:#444}
    .btn{fill:#1f6f3a}
    .bt{font-size:22px;font-weight:700;fill:#fff}
    .sec{fill:#fff;stroke:#111;stroke-width:2}
    .st{font-size:20px}
    .big{font-size:56px;font-weight:700}
    .lab{font-size:16px;fill:#444}
    .k{fill:#c9a25a;stroke:#7a5a20}
    .p{fill:none;stroke:#e00;stroke-width:3}
    .pw{fill:none;stroke:#fff;stroke-width:6}
  </style>

  <!-- Screen 1: Prüfen -->
  <text x="40" y="40" font-size="20" font-weight="700">4 · Prüfen</text>
  <rect class="dev" x="40" y="55" width="380" height="820" rx="24"/>
  <text x="65" y="100" font-size="17" fill="#1f6f3a">‹ Zurück</text>
  <text x="300" y="100" font-size="17" fill="#1f6f3a">Später prüfen</text>
  <text class="t" x="65" y="145">3 Stellen bitte kurz prüfen</text>
  <text class="s" x="65" y="172">Stelle 2 von 3</text>
  <rect x="65" y="190" width="330" height="330" fill="#fafafa" stroke="#999"/>
  <g>
    <ellipse class="k" cx="150" cy="270" rx="34" ry="18" transform="rotate(20 150 270)"/>
    <ellipse class="k" cx="190" cy="290" rx="34" ry="18" transform="rotate(-10 190 290)"/>
    <ellipse class="k" cx="230" cy="350" rx="34" ry="18" transform="rotate(60 230 350)"/>
    <ellipse class="k" cx="300" cy="300" rx="34" ry="18" transform="rotate(0 300 300)"/>
    <ellipse class="k" cx="310" cy="420" rx="34" ry="18" transform="rotate(35 310 420)"/>
    <ellipse class="k" cx="160" cy="430" rx="34" ry="18" transform="rotate(-40 160 430)"/>
    <ellipse class="k" cx="200" cy="470" rx="34" ry="18" transform="rotate(10 200 470)"/>
  </g>
  <g>
    <circle class="pw" cx="150" cy="270" r="11"/><circle class="p" cx="150" cy="270" r="11"/>
    <circle class="pw" cx="190" cy="290" r="11"/><circle class="p" cx="190" cy="290" r="11"/>
    <circle class="pw" cx="300" cy="300" r="11"/><circle class="p" cx="300" cy="300" r="11"/>
    <circle class="pw" cx="310" cy="420" r="11"/><circle class="p" cx="310" cy="420" r="11"/>
    <circle class="pw" cx="160" cy="430" r="11"/><circle class="p" cx="160" cy="430" r="11"/>
    <circle class="pw" cx="200" cy="470" r="11"/><circle class="p" cx="200" cy="470" r="11"/>
  </g>
  <circle cx="230" cy="350" r="26" fill="none" stroke="#1f6f3a" stroke-width="3" stroke-dasharray="6 5"/>
  <text x="262" y="356" font-size="15" fill="#1f6f3a">fehlt? antippen</text>
  <rect x="65" y="535" width="330" height="80" rx="10" fill="#fff6d6" stroke="#c9a200"/>
  <text x="80" y="565" font-size="18">„Liegen hier zwei Körner</text>
  <text x="80" y="592" font-size="18">übereinander?“</text>
  <text class="s" x="65" y="645">Tippen: Punkt setzen oder entfernen</text>
  <text class="st" x="65" y="680">In diesem Ausschnitt: <tspan font-weight="700">6 Körner</tspan></text>
  <rect class="sec" x="65" y="715" width="150" height="60" rx="10"/>
  <text class="st" x="78" y="752">↶ Rückgängig</text>
  <rect class="btn" x="228" y="715" width="167" height="60" rx="10"/>
  <text class="bt" x="248" y="753">Stimmt so ›</text>
  <text class="s" x="65" y="830">Ein Bildschirm pro Stelle. Kein Werkzeug.</text>

  <!-- Screen 2: Ergebnis -->
  <text x="440" y="40" font-size="20" font-weight="700">5 · Ergebnis + Rechner</text>
  <rect class="dev" x="440" y="55" width="380" height="820" rx="24"/>
  <text x="465" y="100" font-size="17" fill="#1f6f3a">‹ Verlauf</text>
  <text class="t" x="465" y="145">RGT Reform · Hänger 3</text>
  <text class="lab" x="465" y="185">KÖRNER</text>
  <text font-size="40" font-weight="700" x="465" y="230">982</text>
  <text font-size="17" x="555" y="228" fill="#1f6f3a">✓ Prüfstellen bestätigt</text>
  <line x1="465" y1="255" x2="795" y2="255" stroke="#ccc"/>
  <text class="lab" x="465" y="285">GEWICHT DIESER KÖRNER</text>
  <rect class="sec" x="465" y="298" width="200" height="56" rx="8"/>
  <text font-size="26" x="480" y="336">45,5</text><text font-size="22" x="630" y="336">g</text>
  <text font-size="22" x="685" y="335">TKG</text>
  <text font-size="30" font-weight="700" x="685" y="372">46,3 g</text>
  <line x1="465" y1="395" x2="795" y2="395" stroke="#ccc"/>
  <text class="lab" x="465" y="425">AUSSAAT</text>
  <text class="st" x="465" y="460">Saatstärke</text><text class="lab" x="465" y="480">keimfähige Körner/m²</text><rect class="sec" x="680" y="440" width="115" height="40" rx="6"/><text class="st" x="700" y="467">320</text>
  <text class="st" x="465" y="515">Keimfähigkeit %</text><text class="lab" x="465" y="535">vom Sacketikett</text><rect class="sec" x="680" y="495" width="115" height="40" rx="6"/><text class="st" x="700" y="522">95</text>
  <text font-size="17" x="465" y="575" fill="#1f6f3a">Mehr › (Pflanzen/m² + Feldaufgang)</text>
  <rect x="465" y="595" width="330" height="155" rx="12" fill="#e7f3ea" stroke="#1f6f3a" stroke-width="2"/>
  <text class="lab" x="485" y="625">AUSSAATMENGE</text>
  <text class="big" x="485" y="682">156</text><text font-size="26" x="600" y="682">kg/ha</text>
  <text class="s" x="485" y="710">320 × 46,3 g ÷ 95 % = 156 kg/ha</text><text class="s" x="485" y="736">Drillmaschine auf 156 kg/ha abdrehen</text>
  <rect class="btn" x="465" y="765" width="330" height="60" rx="10"/>
  <text class="bt" x="585" y="803">Speichern</text>
  <text font-size="18" x="520" y="857" fill="#1f6f3a">Nächste Probe (gleiche Sorte)</text>

  <!-- Screen 3: Verlauf -->
  <text x="840" y="40" font-size="20" font-weight="700">0 · Verlauf (Start)</text>
  <rect class="dev" x="840" y="55" width="380" height="820" rx="24"/>
  <text class="t" x="865" y="110">Tausendkorn</text>
  <rect class="btn" x="865" y="135" width="330" height="70" rx="12"/>
  <text class="bt" x="955" y="179" font-size="26">+ Neue Probe</text>
  <g font-size="19">
    <rect class="sec" x="865" y="230" width="330" height="95" rx="10"/>
    <text x="882" y="262" font-weight="700">RGT Reform · Hänger 3</text>
    <text x="882" y="290" fill="#444" font-size="16">Winterweizen · heute 18:40</text>
    <text x="882" y="314" font-size="18">TKG 46,3 g · <tspan font-weight="700">156 kg/ha</tspan></text>

    <rect class="sec" x="865" y="340" width="330" height="95" rx="10"/>
    <text x="882" y="372" font-weight="700">RGT Reform · Hänger 2</text>
    <text x="882" y="400" fill="#444" font-size="16">Winterweizen · heute 17:55</text>
    <text x="882" y="424" font-size="18">TKG 50,1 g · <tspan font-weight="700">169 kg/ha</tspan></text>

    <rect class="sec" x="865" y="450" width="330" height="95" rx="10"/>
    <text x="882" y="482" font-weight="700">KWS Higgins · Partie A</text>
    <text x="882" y="510" fill="#444" font-size="16">Wintergerste · gestern</text>
    <rect x="882" y="520" width="150" height="26" rx="13" fill="#fff6d6" stroke="#c9a200"/>
    <text x="895" y="539" font-size="15">⚠ 2 Stellen prüfen</text>

    <rect class="sec" x="865" y="560" width="330" height="95" rx="10"/>
    <text x="882" y="592" font-weight="700">Hänger 1</text>
    <text x="882" y="620" fill="#444" font-size="16">Winterroggen · gestern</text>
    <rect x="882" y="630" width="140" height="26" rx="13" fill="#eee" stroke="#888"/>
    <text x="895" y="649" font-size="15">⏸ Wartet auf Netz</text>
  </g>
  <text class="s" x="865" y="700">Status immer als Wort + Symbol,</text>
  <text class="s" x="865" y="722">nie nur Farbe.</text>
</svg>
